services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: cascade
      POSTGRES_PASSWORD: "test_password"
      POSTGRES_DB: cascade
    volumes:
      - cascade-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cascade -d cascade"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cascade-pgdata:
